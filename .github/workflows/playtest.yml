# Runs on GitHub's Linux machines, by hand only (the user, 2026-10-06: it
# duplicated the tests run on the PC before every push and sat failing for
# 11 days unnoticed). Start it from the Actions tab ("Run workflow"), e.g.
# for a release check. The road check, then the automated play-test with no
# window and no GPU (the same scenarios as tools/run_test.sh, minus
# screenshots and frame rates). Looks, sound and frame rate need a real PC.
name: Play-test (headless)

on:
  workflow_dispatch:

concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Road check (grades, cuts, gaps)
        shell: bash
        run: |
          pip install --quiet pillow
          python3 tools/gen/layout_check.py | tee layout_check.txt
          grep -q "no problems" layout_check.txt

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/g.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/g.zip -d ~/godot
          rm ~/godot/g.zip

      - name: Import the project
        run: |
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path FindingNaresh --import 2>&1 | tail -3

      # the full regression suite runs here, so it never holds up work on the PC
      - name: Play-test, everything (tools/test_plan.sh "full")
        run: TIMEOUT=3600 GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 tools/run_test_headless.sh full

      # On a failure, put the reason where anyone can read it without logging
      # in: the run's annotations (the public API shows them; the log itself
      # needs an account). The FAIL / SCRIPT ERROR lines, else the log's end.
      - name: Why it failed (annotations)
        if: failure()
        shell: bash
        run: |
          log=tools/_last_playtest.log
          if [ ! -f "$log" ]; then echo "::error::no play-test log was written"; exit 0; fi
          seg=$(grep -m1 -E "^\[test\] adapter=|segment" "$log" | cut -c1-200)
          echo "::error::segment: ${seg:-unknown} (log $(wc -l < "$log") lines)"
          hits=$(grep -E "FAIL|SCRIPT ERROR|ERROR:|Parse Error|at: " "$log" | grep -v "Interpolated Camera3D" | head -8)
          if [ -z "$hits" ]; then hits=$(tail -8 "$log"); fi
          echo "$hits" | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-300)"
          done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-logs
          path: |
            tools/_last_playtest.log
